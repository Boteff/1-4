<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aspect Ratio Calculator</title>

<style>
    body{
        font-family:Arial,Helvetica,sans-serif;
        background:#f5f5f5;
        padding:40px;
        display:flex;
        justify-content:center;
    }

    .container{
        background:#fff;
        padding:30px;
        border-radius:12px;
        box-shadow:0 5px 15px rgba(0,0,0,.1);
        max-width:500px;
        width:100%;
    }

    h2{
        margin-top:0;
        text-align:center;
    }

    input{
        width:100%;
        padding:12px;
        font-size:18px;
        margin-bottom:20px;
        border:1px solid #ccc;
        border-radius:8px;
        box-sizing:border-box;
    }

    table{
        width:100%;
        border-collapse:collapse;
    }

    th,td{
        padding:12px;
        border-bottom:1px solid #ddd;
        text-align:left;
    }

    th{
        background:#f0f0f0;
    }

    td:last-child{
        text-align:right;
        font-weight:bold;
    }
</style>
</head>

<body>

<div class="container">
    <h2>Aspect Ratio Calculator</h2>

    <input
        type="number"
        id="width"
        placeholder="Enter Width"
        oninput="calculate()"
    >

    <table>
        <thead>
            <tr>
                <th>Aspect Ratio</th>
                <th>Resolution</th>
            </tr>
        </thead>
        <tbody id="results"></tbody>
    </table>
</div>

<script>
const ratios = [
    { name: "4:5", w:4, h:5 },
    { name: "3:4", w:3, h:4 },
    { name: "5:7", w:5, h:7 },
    { name: "2:3", w:2, h:3 },
    { name: "3:5", w:3, h:5 },
    { name: "9:16", w:9, h:16 },
    { name: "9:21", w:9, h:21 }
];

function calculate() {

    const width = parseFloat(document.getElementById("width").value);
    const tbody = document.getElementById("results");

    if (!width || width <= 0) {
        tbody.innerHTML = "";
        return;
    }

    let html = "";
    ratios.forEach(ratio => {

        const height = Math.round(width * ratio.h / ratio.w);

        html += `
            <tr>
                <td>${ratio.name}</td>
                <td>${width} × ${height}</td>
            </tr>
        `;
    });

    tbody.innerHTML = html;

}

calculate();
</script>

</body>
</html>
